spring.application.name=enrollment-service

# Actuator: only /actuator/health is exposed over HTTP by default; add the ones useful for learning.
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

# Return RFC 9457 "problem details" JSON for errors such as validation failures.
spring.mvc.problemdetails.enabled=true

# Cassandra (started by compose.yaml). The driver requires the local datacenter name so it only
# routes requests to nodes in that DC. The Docker image's default DC is "datacenter1".
spring.cassandra.contact-points=localhost:9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=enrollment

# Consistency level: how many replicas must acknowledge a read/write before it succeeds.
# LOCAL_QUORUM = a majority of replicas in this DC (2 of 3 in production; 1 of 1 locally).
# Reads and writes both at LOCAL_QUORUM always overlap on at least one replica, so reads see the latest write.
# Try ONE (faster, may read stale data) or ALL (fails if any replica is down).
spring.cassandra.request.consistency=local_quorum
